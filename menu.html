<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <title>🎡 Ruleta TypeScript - Menú Principal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <!-- Partículas de fondo -->
    <div class="particles" id="particles"></div>
    
    <!-- Pantalla de inicio/menú -->
    <div class="screen" id="menuScreen">
        <div class="container">
            <div class="logo-container">
                <h1 class="game-title">
                    <span class="glow">🎡</span>
                    <span class="title-text">RULETA</span>
                    <span class="title-highlight">TypeScript</span>
                </h1>
                <p class="subtitle">La Fortuna del Código - Multijugador Online</p>
            </div>
            
            <div class="menu-options">
                <button class="btn btn-primary btn-large" id="createRoomBtn">
                    🎮 Crear Sala Nueva
                </button>
                <button class="btn btn-secondary btn-large" id="joinRoomBtn">
                    🚪 Unirse a Sala
                </button>
            </div>
        </div>
    </div>
    
    <!-- Modal para unirse a sala -->
    <div class="modal hidden" id="joinRoomModal">
        <div class="modal-content">
            <h2>Unirse a Sala</h2>
            <div class="input-group-vertical">
                <input type="text" id="joinPlayerName" placeholder="Tu nombre" maxlength="20">
                <input type="text" id="joinRoomCode" placeholder="Código de sala (ej: ABC123)" maxlength="6">
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" id="confirmJoinBtn">Unirse</button>
                <button class="btn btn-secondary" id="cancelJoinBtn">Cancelar</button>
            </div>
        </div>
    </div>
    
    <!-- Modal para crear sala -->
    <div class="modal hidden" id="createRoomModal">
        <div class="modal-content">
            <h2>Crear Sala Nueva</h2>
            <div class="input-group-vertical">
                <input type="text" id="createPlayerName" placeholder="Tu nombre" maxlength="20">
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" id="confirmCreateBtn">Crear Sala</button>
                <button class="btn btn-secondary" id="cancelCreateBtn">Cancelar</button>
            </div>
        </div>
    </div>
    
    <!-- Notificaciones flotantes -->
    <div class="notifications" id="notifications"></div>
    
    <script type="module" src="dist/menu.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <title>🎡 Ruleta TypeScript - Resultados</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <!-- Partículas de fondo -->
    <div class="particles" id="particles"></div>
    
    <!-- Pantalla de resultados finales -->
    <div class="screen" id="resultsScreen">
        <div class="container">
            <div class="results-container">
                <h1 class="results-title">
                    <span class="trophy-icon">🏆</span>
                    Resultados Finales
                </h1>
                
                <div class="podium" id="podium">
                    <!-- Se generará dinámicamente -->
                </div>
                
                <div class="final-scores" id="finalScores">
                    <!-- Tabla de puntuaciones finales -->
                </div>
                
                <div class="results-actions">
                    <button class="btn btn-primary" id="playAgainBtn">
                        🔄 Jugar de Nuevo
                    </button>
                    <button class="btn btn-secondary" id="newPlayersBtn">
                        👥 Nuevos Jugadores
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Notificaciones flotantes -->
    <div class="notifications" id="notifications"></div>
    
    <!-- Efectos especiales -->
    <canvas class="confetti-canvas" id="confettiCanvas"></canvas>
    
    <script type="module" src="dist/results.js"></script>
</body>
</html>
